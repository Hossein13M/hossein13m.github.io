# Fail a pull request when a dependency update adds a high-severity advisory.
name: Dependency review

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # A manual run has no pull request, so compare the selected branch with master and skip the comment.
          comment-summary-in-pr: ${{ github.event_name == 'pull_request' && 'always' || 'never' }}
          base-ref: ${{ github.event_name == 'workflow_dispatch' && 'master' || '' }}
          head-ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
